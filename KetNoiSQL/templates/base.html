<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quản Lý Sinh Viên{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Menu điều hướng -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">QLSV App</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('index') }}">Danh sách SV</a>
                <a class="nav-link text-info" href="{{ url_for('try_queries') }}" target="_blank">Thử truy vấn (/thu-truy-van)</a>
            </div>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 800px;">
        <!-- Hiển thị thông báo Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show p-2 mb-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close p-2" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Nội dung thay đổi từng trang -->
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
