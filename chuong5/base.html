<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bài Tập Flask{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Thanh Menu Điều Hướng -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Chương 5 - Bài Tập</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'may_tinh' %}active fw-bold{% endif %}" href="/">
                            1. Máy Tính
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'diem_hp' %}active fw-bold{% endif %}" href="/diem-hoc-phan">
                            2. Điểm Học Phần
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'bmi' %}active fw-bold{% endif %}" href="/bmi">
                            3. Tính BMI
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Khung chứa nội dung từng trang -->
    <div class="container my-4" style="max-width: 550px;">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
