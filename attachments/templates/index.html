{% extends "base2.html" %}

{% block title %}Trang Chủ{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center py-5">
        <div class="card shadow-sm p-4">
            <h2 class="fw-bold mb-3">Chào mừng bạn đến với ứng dụng</h2>
            <p class="text-muted">Hệ thống quản lý tài khoản người dùng đơn giản.</p>
            
            {% if not session.get('user') %}
                <div class="mt-3">
                    <a href="{{ url_for('login') }}" class="btn btn-primary me-2">Đăng nhập ngay</a>
                    <a href="{{ url_for('register') }}" class="btn btn-outline-secondary">Tạo tài khoản</a>
                </div>
            {% else %}
                <div class="mt-3">
                    <a href="{{ url_for('profile') }}" class="btn btn-success">Xem thông tin cá nhân</a>
                </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
